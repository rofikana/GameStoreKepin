<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kepin Store - Top Up Games</title>
  <style>
    /* 1. Variabel Eye-Friendly Dark Theme */
    :root {
      --bg-main: #121824;
      --bg-card: #1e293b;
      --bg-input: #0f172a;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-hover: #2563eb;
      --accent-price: #f59e0b;
      --accent-green: #10b981;
      --border-color: #334155;
      --modal-overlay: rgba(0, 0, 0, 0.7);
    }

    /* 2. Variabel Light Theme Soft */
    [data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-primary: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-price: #d97706;
      --accent-green: #059669;
      --border-color: #e2e8f0;
      --modal-overlay: rgba(15, 23, 42, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 50px;
      line-height: 1.5;
    }

    header {
      background-color: var(--bg-card);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      background-color: var(--accent-primary);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-header {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
    }

    .btn-header:hover {
      border-color: var(--accent-primary);
    }

    .container {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 320px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .game-card {
      background-color: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
    }

    .game-card:hover, .game-card.active {
      transform: translateY(-3px);
      border-color: var(--accent-primary);
    }

    .game-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .game-info {
      padding: 12px;
    }

    .game-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .game-publisher {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
      display: none;
    }

    .checkout-section {
      margin-top: 32px;
      background-color: var(--bg-card);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: none;
    }

    .step-box {
      margin-bottom: 24px;
    }

    .step-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: 12px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-primary);
    }

    .nominal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .item-card {
      padding: 12px 14px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
    }

    .item-card:hover {
      border-color: var(--text-muted);
    }

    .item-card.active {
      border-color: var(--accent-primary);
      background-color: rgba(59, 130, 246, 0.08);
    }

    .item-name {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .item-price {
      font-size: 0.9rem;
      margin-top: 6px;
      color: var(--accent-price);
      font-weight: 600;
    }

    .payment-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .payment-card {
      padding: 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .payment-card:hover {
      border-color: var(--text-muted);
    }

    .payment-card.active {
      border-color: var(--accent-primary);
      background-color: rgba(59, 130, 246, 0.08);
      color: var(--text-main);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-card);
      padding: 24px;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      border: 1px solid var(--border-color);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .invoice-detail {
      background: var(--bg-input);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      border: 1px solid var(--border-color);
    }

    .invoice-detail div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      padding: 8px 0;
    }

    .invoice-detail div:last-child {
      border-bottom: none;
    }

    .btn-close {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 8px;
    }

    .btn-close:hover {
      background: var(--bg-input);
    }

    .history-list {
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .history-card {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .history-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .history-status {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-price);
      font-weight: 600;
      margin-top: 6px;
    }

    .empty-history {
      text-align: center;
      padding: 30px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .btn-danger {
      width: 100%;
      padding: 8px;
      background: transparent;
      color: #ef4444;
      border: 1px solid #ef4444;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>Kepin Store</span>
      <span class="logo-badge">STORE</span>
    </div>
    
    <div class="header-actions">
      <button class="btn-header" onclick="openHistoryModal()">
        <span>📜</span> Riwayat
      </button>

      <button class="btn-header" id="themeToggleBtn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
        <span id="themeText">Dark</span>
      </button>
    </div>
  </header>

  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Pilih Game</h2>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" onkeyup="filterGames()" placeholder="Cari game...">
      </div>
    </div>
    
    <div class="game-grid" id="gameGrid">
      <div class="game-card" id="card-ml" data-title="mobile legends moonton ml" onclick="selectGame('ml')">
        <img src="https://i.pinimg.com/736x/ea/1e/d1/ea1ed14327f20b2037fc7aea3ac523d4.jpg" alt="Mobile Legends">
        <div class="game-info">
          <div class="game-title">Mobile Legends</div>
          <div class="game-publisher">Moonton</div>
        </div>
      </div>

      <div class="game-card" id="card-roblox" data-title="roblox robux" onclick="selectGame('roblox')">
        <img src="https://i.pinimg.com/736x/eb/20/30/eb203036af2bf931259d9c2ae254b2cd.jpg" alt="Roblox">
        <div class="game-info">
          <div class="game-title">Roblox</div>
          <div class="game-publisher">Roblox Corp</div>
        </div>
      </div>

      <div class="game-card" id="card-pubg" data-title="pubg mobile tencent uc" onclick="selectGame('pubg')">
        <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=500&q=80" alt="PUBG Mobile">
        <div class="game-info">
          <div class="game-title">PUBG Mobile</div>
          <div class="game-publisher">Tencent</div>
        </div>
      </div>

      <div class="game-card" id="card-ff" data-title="free fire garena ff" onclick="selectGame('ff')">
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=500&q=80" alt="Free Fire">
        <div class="game-info">
          <div class="game-title">Free Fire</div>
          <div class="game-publisher">Garena</div>
        </div>
      </div>

      <div class="no-result" id="noResult">Game tidak ditemukan.</div>
    </div>

    <div class="checkout-section" id="checkoutSection">
      <div class="step-box">
        <div class="step-title">1. Masukkan User ID</div>
        <div class="form-group">
          <input type="text" id="userId" placeholder="Masukkan ID akun game Anda">
        </div>
      </div>

      <div class="step-box">
        <div class="step-title">2. Pilih Nominal</div>
        <div class="nominal-grid" id="nominalContainer"></div>
      </div>

      <div class="step-box">
        <div class="step-title">3. Metode Pembayaran</div>
        <div class="payment-grid">
          <div class="payment-card" onclick="selectPayment('QRIS', this)">QRIS</div>
          <div class="payment-card" onclick="selectPayment('DANA', this)">DANA</div>
          <div class="payment-card" onclick="selectPayment('GoPay', this)">GoPay</div>
          <div class="payment-card" onclick="selectPayment('ShopeePay', this)">ShopeePay</div>
          <div class="payment-card" onclick="selectPayment('Bank BCA', this)">Bank BCA</div>
        </div>
      </div>

      <button class="btn-submit" onclick="processOrder()">Lanjutkan Pembayaran</button>
    </div>
  </div>

  <!-- Modal Pop-up Invoice -->
  <div class="modal-overlay" id="modalInvoice">
    <div class="modal-box">
      <div class="modal-header">Rincian Transaksi</div>
      <div class="invoice-detail" id="invoiceContent"></div>
      <button class="btn-submit" onclick="sendToWhatsApp()">Bayar via WhatsApp</button>
      <button class="btn-close" onclick="closeModal('modalInvoice')">Batal</button>
    </div>
  </div>

  <!-- Modal Pop-up Riwayat Pesanan -->
  <div class="modal-overlay" id="modalHistory">
    <div class="modal-box">
      <div class="modal-header">Riwayat Pesanan Anda</div>
      <div class="history-list" id="historyContainer"></div>
      <button class="btn-danger" id="btnClearHistory" onclick="clearHistory()">Hapus Semua Riwayat</button>
      <button class="btn-close" onclick="closeModal('modalHistory')">Tutup</button>
    </div>
  </div>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButton(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(newTheme);
    }

    function updateThemeButton(theme) {
      const themeIcon = document.getElementById('themeIcon');
      const themeText = document.getElementById('themeText');
      if (theme === 'light') {
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light';
      } else {
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark';
      }
    }

    initTheme();

    const catalog = {
      ml: { title: "Mobile Legends", items: [{ name: "86 Diamonds", price: 20000 }, { name: "172 Diamonds", price: 40000 }, { name: "257 Diamonds", price: 60000 }, { name: "Weekly Pass", price: 28000 }] },
      roblox: { title: "Roblox", items: [{ name: "80 Robux", price: 15000 }, { name: "400 Robux", price: 75000 }, { name: "800 Robux", price: 140000 }] },
      pubg: { title: "PUBG Mobile", items: [{ name: "60 UC", price: 15000 }, { name: "325 UC", price: 75000 }, { name: "660 UC", price: 145000 }] },
      ff: { title: "Free Fire", items: [{ name: "140 Diamonds", price: 20000 }, { name: "355 Diamonds", price: 50000 }, { name: "720 Diamonds", price: 100000 }] }
    };

    let selectedGameKey = '';
    let selectedItem = null;
    let selectedPayment = '';

    function filterGames() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.game-card');
      const noResult = document.getElementById('noResult');
      let visibleCount = 0;

      cards.forEach(card => {
        const titleData = card.getAttribute('data-title').toLowerCase();
        if (titleData.includes(input)) {
          card.style.display = "block";
          visibleCount++;
        } else {
          card.style.display = "none";
        }
      });

      noResult.style.display = visibleCount === 0 ? "block" : "none";
    }

    function selectGame(gameKey) {
      selectedGameKey = gameKey;
      selectedItem = null;

      document.querySelectorAll('.game-card').forEach(card => card.classList.remove('active'));
      document.getElementById('card-' + gameKey).classList.add('active');
      document.getElementById('checkoutSection').style.display = 'block';

      const nominalContainer = document.getElementById('nominalContainer');
      nominalContainer.innerHTML = '';

      catalog[gameKey].items.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'item-card';
        itemEl.innerHTML = `
          <div class="item-name">${item.name}</div>
          <div class="item-price">Rp ${item.price.toLocaleString('id-ID')}</div>
        `;
        itemEl.onclick = () => selectNominal(item, itemEl);
        nominalContainer.appendChild(itemEl);
      });

      document.getElementById('checkoutSection').scrollIntoView({ behavior: 'smooth' });
    }

    function selectNominal(itemObj, element) {
      selectedItem = itemObj;
      document.querySelectorAll('.item-card').forEach(card => card.classList.remove('active'));
      element.classList.add('active');
    }

    function selectPayment(paymentName, element) {
      selectedPayment = paymentName;
      document.querySelectorAll('.payment-card').forEach(card => card.classList.remove('active'));
      element.classList.add('active');
    }

    function processOrder() {
      const userId = document.getElementById('userId').value.trim();

      if (!selectedGameKey) return alert('Pilih Game terlebih dahulu!');
      if (!userId) return alert('Isi User ID Akun Anda!');
      if (!selectedItem) return alert('Pilih Nominal Voucher!');
      if (!selectedPayment) return alert('Pilih Metode Pembayaran!');

      const invoiceHTML = `
        <div><span>Game:</span> <b>${catalog[selectedGameKey].title}</b></div>
        <div><span>User ID:</span> <b>${userId}</b></div>
        <div><span>Item:</span> <b>${selectedItem.name}</b></div>
        <div><span>Pembayaran:</span> <b>${selectedPayment}</b></div>
        <div><span>Total Tagihan:</span> <b style="color:var(--accent-price);">Rp ${selectedItem.price.toLocaleString('id-ID')}</b></div>
      `;

      document.getElementById('invoiceContent').innerHTML = invoiceHTML;
      document.getElementById('modalInvoice').style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function sendToWhatsApp() {
      const userId = document.getElementById('userId').value.trim();
      
      // NOMOR WHATSAPP ANDA:
      const adminWA = "6282112925622";

      // 1. Simpan Transaksi ke LocalStorage pembeli
      saveOrderToHistory({
        game: catalog[selectedGameKey].title,
        userId: userId,
        item: selectedItem.name,
        payment: selectedPayment,
        price: selectedItem.price,
        date: new Date().toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' })
      });

      // 2. Langsung Buka WhatsApp
      const text = `Halo Admin, saya ingin konfirmasi pesanan:%0A` +
                   `- Game: ${catalog[selectedGameKey].title}%0A` +
                   `- User ID: ${userId}%0A` +
                   `- Item: ${selectedItem.name}%0A` +
                   `- Pembayaran: ${selectedPayment}%0A` +
                   `- Total: Rp ${selectedItem.price.toLocaleString('id-ID')}`;

      window.open(`https://wa.me/${adminWA}?text=${text}`, '_blank');
      closeModal('modalInvoice');
    }

    function saveOrderToHistory(orderData) {
      let history = JSON.parse(localStorage.getItem('orderHistory')) || [];
      history.unshift(orderData);
      localStorage.setItem('orderHistory', JSON.stringify(history));
    }

    function openHistoryModal() {
      const historyContainer = document.getElementById('historyContainer');
      const btnClear = document.getElementById('btnClearHistory');
      let history = JSON.parse(localStorage.getItem('orderHistory')) || [];

      if (history.length === 0) {
        historyContainer.innerHTML = `<div class="empty-history">Belum ada riwayat pesanan.</div>`;
        btnClear.style.display = 'none';
      } else {
        btnClear.style.display = 'block';
        historyContainer.innerHTML = history.map(item => `
          <div class="history-card">
            <div class="history-top">
              <span>${item.game}</span>
              <span style="color:var(--accent-price)">Rp ${item.price.toLocaleString('id-ID')}</span>
            </div>
            <div>${item.item} • ID: <b>${item.userId}</b></div>
            <div class="history-date">Metode: ${item.payment} | ${item.date}</div>
            <span class="history-status">Menunggu Konfirmasi</span>
          </div>
        `).join('');
      }

      document.getElementById('modalHistory').style.display = 'flex';
    }

    function clearHistory() {
      if (confirm('Apakah Anda yakin ingin menghapus semua riwayat pesanan?')) {
        localStorage.removeItem('orderHistory');
        openHistoryModal();
      }
    }
  </script>
</body>
</html>
